[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cve-exposure-check"
version = "0.1.0"
description = "Detection-only CLI that fingerprints versions/config for known CVE exposure (no exploit payloads)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "cve-exposure-check contributors" }]
keywords = ["cve", "security", "fingerprint", "detection-only"]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "PyYAML>=6",
  "cryptography>=42",
  "requests>=2.31",
  "packaging>=23",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cve-exposure-check = "cve_exposure_check.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cve_exposure_check = ["data/*.yaml", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
