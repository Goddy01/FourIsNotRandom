[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fourisnotrandom"
version = "0.1.1"
description = "Detection-only CLI that fingerprints versions/config for known CVE exposure (no exploit payloads)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "FourIsNotRandom" }]
keywords = ["cve", "security", "fingerprint", "detection-only"]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "PyYAML>=6",
  "cryptography>=42",
  "requests>=2.31",
  "packaging>=23",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fourisnotrandom = "fourisnotrandom.cli:app"

[project.urls]
Homepage = "https://github.com/Goddy01/FourIsNotRandom"
Repository = "https://github.com/Goddy01/FourIsNotRandom"
Issues = "https://github.com/Goddy01/FourIsNotRandom/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fourisnotrandom = ["data/*.yaml", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
